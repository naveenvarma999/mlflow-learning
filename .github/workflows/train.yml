name: train-and-gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train
        run: python train.py

      - name: Promotion gate
        run: python promote.py

      - name: Keep the database
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-db
          path: mlflow.db